# Paste into /root/expense-tracker/nginx.conf.template (after the existing
# server blocks), with FOOD_DOMAIN replaced by the real subdomain.
# Before the 443 block works, the certificate has to exist (see README).

server {
    listen 80;
    server_name FOOD_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name FOOD_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/FOOD_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FOOD_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Phones shrink photos before upload; this is the ceiling for one that didn't.
    client_max_body_size 15M;

    location / {
        # Resolved at request time, so nginx still starts when this app is down.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $food_upstream http://food-tracker:8000;
        proxy_pass $food_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Recognition takes 5-20 s.
        proxy_read_timeout 120s;
    }
}
